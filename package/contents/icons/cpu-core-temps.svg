<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- CPU body -->
  <rect x="18" y="30" width="70" height="70" rx="10" fill="#3daee9"/>
  <!-- inner core -->
  <rect x="32" y="44" width="42" height="42" rx="5" fill="#1d99f3" opacity="0.55"/>
  <rect x="42" y="54" width="22" height="22" rx="3" fill="#ffffff" opacity="0.35"/>

  <!-- pins top -->
  <rect x="32" y="16" width="10" height="16" rx="2" fill="#3daee9"/>
  <rect x="48" y="16" width="10" height="16" rx="2" fill="#3daee9"/>
  <rect x="64" y="16" width="10" height="16" rx="2" fill="#3daee9"/>
  <!-- pins bottom -->
  <rect x="32" y="98" width="10" height="16" rx="2" fill="#3daee9"/>
  <rect x="48" y="98" width="10" height="16" rx="2" fill="#3daee9"/>
  <rect x="64" y="98" width="10" height="16" rx="2" fill="#3daee9"/>
  <!-- pins left -->
  <rect x="4" y="44" width="16" height="10" rx="2" fill="#3daee9"/>
  <rect x="4" y="60" width="16" height="10" rx="2" fill="#3daee9"/>
  <rect x="4" y="76" width="16" height="10" rx="2" fill="#3daee9"/>

  <!-- Thermometer tube -->
  <rect x="94" y="18" width="16" height="62" rx="8" fill="#fcfcfc" stroke="#232629" stroke-width="3"/>
  <!-- mercury -->
  <rect x="99" y="42" width="6" height="34" rx="3" fill="#e74c3c"/>
  <!-- bulb -->
  <circle cx="102" cy="92" r="14" fill="#e74c3c" stroke="#232629" stroke-width="3"/>
  <circle cx="102" cy="92" r="6" fill="#ff8a80"/>
  <!-- scale ticks -->
  <rect x="94" y="30" width="5" height="2.5" fill="#232629"/>
  <rect x="94" y="42" width="5" height="2.5" fill="#232629"/>
  <rect x="94" y="54" width="5" height="2.5" fill="#232629"/>
</svg>
